name: Public VPN ranking (bounded Xray checks)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: ['checker.py', 'tests/**', '.github/workflows/verify-nodes.yml', 'ops/hourly-trigger.txt']
permissions: {}
concurrency:
  group: secureconnect-free-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parser, safety and contract tests
        run: python -m unittest discover -s tests -v
      - name: Fetch OFFICIAL pinned Xray Linux amd64 container and copy its binary
        shell: bash
        run: |
          set -euo pipefail
          # Official, exact release AND immutable Linux/amd64 SHA-256 OCI digest.
          image='ghcr.io/xtls/xray-core:26.10.21@sha256:447ffc750a0b87d6e4f2c38425f68105bfc8c789e59c22d83b94eb7e1e648c50'
          docker pull --platform linux/amd64 "$image"
          cid="$(docker create --platform linux/amd64 "$image")"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp "$cid:/usr/local/bin/xray" ./xray
          chmod 700 ./xray
          ./xray version | head -1
      - name: Fetch / probe with strict wall clock limit
        timeout-minutes: 21
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          PREVIOUS_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.json
          PREVIOUS_CANDIDATES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/candidates.json
          XRAY_BIN: ./xray
        run: timeout --signal=TERM --kill-after=5s 20m python checker.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  publish-raw:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Mirror verified JSON to public GitHub raw endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          tar -xf pages-artifact/artifact.tar -C published
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path("published/feed.json").read_text(encoding="utf-8"))
          assert feed["schema"] == 1 and feed["checker"] == "xray-github-actions"
          assert isinstance(feed["results"], list) and len(feed["results"]) <= 180
          assert all(set(r) == {"fingerprint", "source_id", "https_ok", "youtube_page_ok", "https_latency_ms", "checked_at"} for r in feed["results"])
          assert all(len(r["fingerprint"]) == 64 and r["https_ok"] is True for r in feed["results"])
          assert Path("published/feed.json").stat().st_size <= 256 * 1024
          PY
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path("published/candidates.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          assert obj["schema"] == 1 and obj["checker"] == "xray-github-actions"
          entries = obj["candidates"]
          assert isinstance(entries, list) and len(entries) <= 24
          assert p.stat().st_size <= 128 * 1024
          assert all(isinstance(e["uri"], str) and len(e["uri"]) <= 4096 and
              e["uri"].startswith(("vless://", "vmess://", "trojan://", "ss://"))
              for e in entries)
          PY
          python - <<'PY'
          from pathlib import Path
          import json
          obj = json.loads(Path("published/restarts.json").read_text(encoding="utf-8"))
          assert obj["schema"] == 1 and obj["kind"] == "xray_process_restart"
          assert obj["android_tun_tested"] is False
          assert len(obj["results"]) <= 3
          assert all(set(r) == {"fingerprint", "source_id", "restart_ok", "restart_https_latency_ms", "checked_at"} for r in obj["results"])
          assert Path("published/restarts.json").stat().st_size <= 8192
          PY
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path("published/payload.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"] == 1 and r["kind"] == "xray_https_download"
          assert r["android_tun_tested"] is False and r["megafon_tested"] is False
          assert r["upload_speed_tested"] is False
          assert isinstance(r["results"], list) and len(r["results"]) <= 3
          assert all(set(x) == {"fingerprint","source_id","payload_ok","download_bytes","download_ms","checked_at"} for x in r["results"])
          assert p.stat().st_size <= 8192
          PY
          cp published/payload.json ./payload.json
          cp published/restarts.json ./restarts.json
          cp published/candidates.json ./candidates.json
          cp published/feed.json ./feed.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.json candidates.json restarts.json payload.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified public feed"
            git push origin HEAD:main
          fi
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish static HTTPS feed
        id: deploy
        uses: actions/deploy-pages@v4
