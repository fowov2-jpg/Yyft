name: Build SecureConnect Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/source.zip'
      - '.github/workflows/android-build.yml'
      - 'android/patches/**'
      - 'android/ci-tests/**'

permissions:
  contents: read

concurrency:
  group: secureconnect-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK commandline tools (no obsolete tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack SecureConnect project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s android/source.zip ]; then
            echo "::error::Missing android/source.zip. Upload the prepared SecureConnect source archive to android/source.zip first."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("android/source.zip")
          target = Path("android/build-input")
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              for item in z.infolist():
                  path = target / item.filename
                  if not path.resolve().is_relative_to(target.resolve()):
                      raise ValueError("Unsafe zip entry")
              z.extractall(target)
          assert (target / "SecureConnect-2.4.7/gradlew").is_file()
          PY
          chmod +x android/build-input/SecureConnect-2.4.7/gradlew

      - name: Apply verified SecureConnect 2.4.8 online candidate patch
        run: python android/patches/apply_one_tap.py android/build-input/SecureConnect-2.4.7

      - name: Install CI failure-injection regression tests
        shell: bash
        run: |
          set -euo pipefail
          cp android/ci-tests/CiFailureRecoveryMatrixTest.kt \
             android/build-input/SecureConnect-2.4.7/app/src/test/java/com/secureconnect/app/vpn/CiFailureRecoveryMatrixTest.kt

      - name: Install one-tap retry policy unit tests
        run: |
          set -euo pipefail
          cp android/ci-tests/OneTapRetryPolicyTest.kt android/build-input/SecureConnect-2.4.7/app/src/test/java/com/secureconnect/app/viewmodel/OneTapRetryPolicyTest.kt

      - name: Apply session timer and expiry guards
        run: python android/patches/apply_session_timer.py android/build-input/SecureConnect-2.4.7

      - name: Install session timer JUnit tests
        run: |
          set -euo pipefail
          cp android/ci-tests/SessionTimerPolicyTest.kt android/build-input/SecureConnect-2.4.7/app/src/test/java/com/secureconnect/app/SessionTimerPolicyTest.kt

      - name: Run offline source security audit (fail closed)
        run: python security_audit/audit.py android/build-input/SecureConnect-2.4.7 .github/workflows/android-build.yml

      - name: Install cloud public-source allowlist tests
        run: |
          cp android/ci-tests/PublicCandidateSourcePolicyTest.kt android/build-input/SecureConnect-2.4.7/app/src/test/java/com/secureconnect/app/vpn/PublicCandidateSourcePolicyTest.kt

      - name: Compile installable debug APK
        working-directory: android/build-input/SecureConnect-2.4.7
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run Android unit tests
        working-directory: android/build-input/SecureConnect-2.4.7
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Audit debug APK permissions, VPN service and APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="android/build-input/SecureConnect-2.4.7/app/build/outputs/apk/debug/app-debug.apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$apk"
          "$aapt" dump badging "$apk" | head -5
          "$aapt" dump permissions "$apk" | tee /tmp/secureconnect-apk-permissions.txt
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/secureconnect-manifest.txt
          grep -q 'android.permission.BIND_VPN_SERVICE' /tmp/secureconnect-manifest.txt
          if grep -Eq 'android.permission.(READ_SMS|READ_CONTACTS|RECORD_AUDIO|CAMERA|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW)' /tmp/secureconnect-apk-permissions.txt; then
            echo "::error::Unapproved sensitive permission detected in APK"
            exit 1
          fi
          "$signer" verify --verbose --print-certs "$apk"
          echo "::warning::This APK uses a debug signing certificate. CI audit does not certify Play Protect safety."

      - name: Upload static audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureconnect-security-audit
          path: security_audit/audit-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish unit-test regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureconnect-android-junit-results
          path: android/build-input/SecureConnect-2.4.7/app/build/test-results/testDebugUnitTest/**/*.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Show APK fingerprint
        if: always()
        shell: bash
        run: |
          if [ -s android/build-input/SecureConnect-2.4.7/app/build/outputs/apk/debug/app-debug.apk ]; then
            sha256sum android/build-input/SecureConnect-2.4.7/app/build/outputs/apk/debug/app-debug.apk
          fi

      # A failed compiler, test or security audit must never publish installable APK.
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SecureConnect-2.4.8-debug-apk
          path: android/build-input/SecureConnect-2.4.7/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
